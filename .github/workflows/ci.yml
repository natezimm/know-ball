name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces its older run. Runs on main are never cancelled,
# so a publish or deploy always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sports_trivia
          POSTGRES_USER: trivia
          POSTGRES_PASSWORD: trivia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trivia -d sports_trivia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TriviaTfm: net10.0
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build KnowBall.sln -c Release
      - name: Unit tests
        run: dotnet test tests/KnowBall.UnitTests -c Release --no-build
      - name: Integration tests (SQLite)
        run: dotnet test tests/KnowBall.IntegrationTests -c Release --no-build
      - name: Integration tests (Postgres)
        env:
          TRIVIA_TEST_POSTGRES: Host=localhost;Port=5432;Database=sports_trivia;Username=trivia;Password=trivia
        run: dotnet test tests/KnowBall.IntegrationTests -c Release --no-build
      - name: Importer runs against Postgres and is repeatable
        env:
          ConnectionStrings__Trivia: Host=localhost;Port=5432;Database=sports_trivia;Username=trivia;Password=trivia
          Import__MaxAttempts: "1"
        run: |
          IMPORTER=src/KnowBall.Importer/bin/Release/net10.0/KnowBall.Importer.dll
          dotnet $IMPORTER --once --source seed --no-history
          dotnet $IMPORTER --once --source seed --no-history | tee second.txt
          grep -q "0 new, 0 updated, 0 deactivated, 0 team changes" second.txt

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/know-ball
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/know-ball/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Numbers Don't Lie prototype invariants
        run: node --test ../../docs/prototypes/numbers-dont-lie/model.test.mjs
      - run: npm run build

  # Plays every game in Chromium against the real API and the production build, on SQLite with
  # offline test data (web/know-ball/e2e/serve.sh).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TriviaTfm: net10.0
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        working-directory: web/know-ball
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/know-ball/package-lock.json
      - run: npm ci --no-audit --no-fund
      # The browser download is cached per Playwright version; its system libraries are not.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run e2e
      - name: Numbers Don't Lie prototype browser checks
        run: node ../../docs/prototypes/numbers-dont-lie/browser-check.mjs
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/know-ball/playwright-report
            web/know-ball/test-results
          retention-days: 7

  # Builds the production image and checks it on a fresh Postgres: migrations, importer, daily
  # games and Eastern calendar behavior as the non-root user.
  # The image is built with the GitHub Actions layer cache, which the publish job then reuses
  # instead of building it again from scratch.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Backup tooling failure-path tests
        run: python3 -m unittest discover -s tests -p test_operations.py -v
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: know-ball
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        env:
          SKIP_BUILD: "1"
        run: ./scripts/docker-smoke.sh
      - name: Back up and restore offline fixture data
        run: python3 scripts/operations-smoke.py

  # On main, once everything above passes: publish the image to GitHub's registry, then roll it out
  # on the VM. The VM only pulls the image; it never builds. Setup: deploy/README.md.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, e2e, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/natezimm/know-ball:latest
            ghcr.io/natezimm/know-ball:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    concurrency: deploy
    env:
      GCP_HOST: ${{ secrets.GCP_HOST }}
      GCP_USER: ${{ secrets.GCP_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to the VM
        env:
          GCP_SSH_KEY: ${{ secrets.GCP_SSH_KEY }}
          GCP_KNOWN_HOSTS: ${{ secrets.GCP_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GCP_HOST" ]; then
            echo "::notice::Deploy secrets are not set yet (deploy/README.md); skipping the deploy."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$GCP_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # GCP_KNOWN_HOSTS pins the VM's host key, so the deploy never hands credentials to a
          # machine posing as it.
          if [ -z "$GCP_KNOWN_HOSTS" ]; then
            echo "::error::The GCP_KNOWN_HOSTS secret is not set (deploy/README.md)."
            exit 1
          fi
          printf '%s\n' "$GCP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/deploy -o StrictHostKeyChecking=yes"
          scp -i ~/.ssh/deploy deploy/docker-compose.yml "$GCP_USER@$GCP_HOST:know-ball/docker-compose.yml"
          # The job's token can read the private image; it expires when this job ends.
          printf '%s' "$REGISTRY_TOKEN" | $SSH "$GCP_USER@$GCP_HOST" "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH "$GCP_USER@$GCP_HOST" "cd know-ball && sed -i '/^KNOWBALL_TAG=/d' .env && echo 'KNOWBALL_TAG=${{ github.sha }}' >> .env && docker compose pull -q && docker compose up -d --remove-orphans && docker image prune -f"
          for i in $(seq 1 30); do
            if $SSH "$GCP_USER@$GCP_HOST" "curl -fs http://127.0.0.1:8090/health" >/dev/null; then
              echo "Deployed ${{ github.sha }}; the site is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The site did not become healthy after the deploy."
          $SSH "$GCP_USER@$GCP_HOST" "cd know-ball && docker compose logs --tail 80 site"
          exit 1
