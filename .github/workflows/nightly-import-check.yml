# Daily canary: do the live sources still parse? A fresh database loads the full history
# (Basketball-Reference mirror, Wikidata), then the ESPN rosters. Catches upstream changes
# before the production importer's nightly run does. Uses a throwaway SQLite database.
name: Nightly import check

on:
  schedule:
    - cron: "17 7 * * *" # 3:17 AM Eastern (EDT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TriviaTfm: net11.0
      Database__Provider: Sqlite
      ConnectionStrings__Trivia: Data Source=canary.db
      Import__MaxAttempts: "2"
      Import__RetryDelaySeconds: "30"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - run: dotnet build src/KnowBall.Importer -c Release
      - name: Live import (history, crosswalk, ESPN rosters)
        run: dotnet src/KnowBall.Importer/bin/Release/net11.0/KnowBall.Importer.dll --once --source espn
