# Production: the site, its database and the nightly importer, behind the host's nginx.
# Lives in ~/know-ball on the VM next to a .env file (see deploy/README.md). The deploy job in CI
# copies this file there and runs:  docker compose pull && docker compose up -d
#
# Settings, from .env:
#   KNOWBALL_DB_PASSWORD  the database password (any long random string; set once, never change)
#   KNOWBALL_TAG          the image tag to run (default latest; CI sets the commit it deploys)
#   OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_HEADERS
#                         where to send traces, metrics and logs (Grafana Cloud's OTLP gateway and its
#                         Basic auth header); leave both unset to send nothing (docs/observability.md)
name: knowball

# OpenTelemetry settings shared by the site and the importer. With no endpoint, nothing is sent.
x-telemetry: &telemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: service.version=${KNOWBALL_TAG:-latest},deployment.environment.name=production

# Docker keeps container logs forever by default. Cap each service at three 10 MB files so a noisy day
# cannot fill the shared VM's disk.
# The app containers run as the image's non-root user with no Linux capabilities, a read-only root
# filesystem (only /data and a small /tmp are writable) and no way to gain privileges.
x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6-bookworm
    logging: *logging
    # Postgres's entrypoint needs its capabilities to drop from root to the postgres user.
    security_opt: ["no-new-privileges:true"]
    # Sized for a small shared VM: the default is 128 MB of buffers, more than this database needs; the
    # kernel's file cache still holds what the buffers don't.
    command: ["postgres", "-c", "shared_buffers=32MB"]
    environment:
      POSTGRES_DB: know_ball
      POSTGRES_USER: knowball
      POSTGRES_PASSWORD: ${KNOWBALL_DB_PASSWORD:?set KNOWBALL_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowball -d know_ball"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Only nginx on this machine can reach the site; it forwards knowball.nathanzimmerman.com here.
  site:
    image: ghcr.io/natezimm/know-ball:${KNOWBALL_TAG:-latest}
    <<: *hardened
    logging: *logging
    environment:
      <<: *telemetry
      ConnectionStrings__Trivia: Host=db;Port=5432;Database=know_ball;Username=knowball;Password=${KNOWBALL_DB_PASSWORD}
      # nginx reaches the container from this network's gateway, so only its X-Forwarded-For counts.
      ForwardedHeaders__KnownNetworks__0: 172.31.250.0/24
      # Set one of these to false in .env, then `docker compose up -d site`, to pause that game (docs/api.md).
      FeatureManagement__LetterJacket: ${KNOWBALL_LETTER_JACKET:-true}
      FeatureManagement__ScoutingReport: ${KNOWBALL_SCOUTING_REPORT:-true}
      FeatureManagement__CareerPath: ${KNOWBALL_CAREER_PATH:-true}
      FeatureManagement__BackOfTheCard: ${KNOWBALL_BACK_OF_THE_CARD:-true}
      FeatureManagement__TeamPhoto: ${KNOWBALL_TEAM_PHOTO:-true}
      FeatureManagement__NumbersDontLie: ${KNOWBALL_NUMBERS_DONT_LIE:-true}
    ports:
      - "127.0.0.1:8090:8080"
    # .NET sizes its heap to the container's limit. Locally the site used about 100 MB uncapped and about
    # 72 MB with a 128 MB cap; 160 MB left room for production's larger player data. OpenTelemetry, when
    # turned on, measured 81 MB without it and 107 MB with it after the same 600 requests, so 192 MB keeps
    # the same headroom.
    mem_limit: 192m
    volumes:
      - photos:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Loads the player history on first start, then refreshes rosters and puzzle queues at 4am Eastern.
  # run-nightly.sh starts a short-lived import each time, so no .NET process idles here all day (about
  # 70 MB measured locally); between imports only a shell and `sleep` are left.
  importer:
    image: ghcr.io/natezimm/know-ball:${KNOWBALL_TAG:-latest}
    <<: *hardened
    logging: *logging
    working_dir: /app/importer
    entrypoint: ["sh", "run-nightly.sh"]
    environment:
      <<: *telemetry
      ConnectionStrings__Trivia: Host=db;Port=5432;Database=know_ball;Username=knowball;Password=${KNOWBALL_DB_PASSWORD}
    depends_on:
      site:
        condition: service_started
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  pgdata:
    name: ${KNOWBALL_DB_VOLUME:-${COMPOSE_PROJECT_NAME}_pgdata}
  photos:
