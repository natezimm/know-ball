# Copy to /etc/nginx/sites-available/, link it into sites-enabled, then run
#   sudo certbot --nginx -d knowball.nathanzimmerman.com
# which adds the HTTPS server and the redirect from HTTP. See deploy/README.md.
server {
    listen 80;
    listen [::]:80;
    server_name knowball.nathanzimmerman.com;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replace, never append: the site trusts exactly one address, the one nginx saw.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
