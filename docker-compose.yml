# Development:  docker compose up -d db            (just Postgres, on localhost:5432)
# Whole site:   docker compose --profile site up -d --build   (site on http://localhost:8080)
#
# Settings, read from the shell or from a .env file beside this one:
#   KNOWBALL_PORT        the port the site is published on (default 8080)
#   KNOWBALL_DB_PORT     the port Postgres is published on (default 5432)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sports_trivia
      POSTGRES_USER: trivia
      POSTGRES_PASSWORD: trivia
    ports:
      - "${KNOWBALL_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trivia -d sports_trivia"]
      interval: 3s
      timeout: 3s
      retries: 20

  # The API and the Angular app in one process. Applies database migrations when it starts.
  site:
    profiles: [site]
    build: .
    image: know-ball
    environment:
      ConnectionStrings__Trivia: Host=db;Port=5432;Database=sports_trivia;Username=trivia;Password=trivia
    ports:
      - "${KNOWBALL_PORT:-8080}:8080"
    volumes:
      - photos:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Loads the player history on first start, then refreshes rosters and puzzle queues at 4am Eastern.
  importer:
    profiles: [site]
    image: know-ball
    working_dir: /app/importer
    entrypoint: ["dotnet", "KnowBall.Importer.dll"]
    environment:
      ConnectionStrings__Trivia: Host=db;Port=5432;Database=sports_trivia;Username=trivia;Password=trivia
    depends_on:
      site:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  photos:
